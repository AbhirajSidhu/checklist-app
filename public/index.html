<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Checklist</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; display: flex; justify-content: center; padding-top: 50px; margin: 0; }
        .container { background-color: #1a1a1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); width: 100%; max-width: 450px; }
        h1 { margin-top: 0; font-size: 24px; color: #fff; text-align: center; }
        .input-area { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #2e2e35; border-radius: 6px; background-color: #202024; color: #fff; font-size: 16px; }
        input[type="text"]:focus { outline: 2px solid #04d361; }
        button { padding: 12px 20px; background-color: #04d361; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #02b351; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; align-items: center; justify-content: space-between; padding: 12px; background-color: #202024; border: 1px solid #2e2e35; border-radius: 6px; margin-bottom: 10px; }
        .item-left { display: flex; align-items: center; gap: 12px; font-size: 16px; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #04d361; }
        li.completed .item-text { text-decoration: line-through; color: #7c7c8a; }
        .delete-btn { background: none; color: #f75a68; border: none; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>☁️ Cloud Checklist</h1>
        <div class="input-area">
            <input type="text" id="itemInput" placeholder="Add a new task..." autocomplete="off">
            <button onclick="addItem()">Add</button>
        </div>
        <ul id="checklist"></ul>
    </div>

    <script>
        const itemInput = document.getElementById('itemInput');
        const checklist = document.getElementById('checklist');

        // Load tasks from backend database on startup
        document.addEventListener('DOMContentLoaded', loadTasks);

        itemInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addItem(); });

        async function loadTasks() {
            checklist.innerHTML = '';
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            tasks.forEach(task => renderTask(task));
        }

        async function addItem() {
            const text = itemInput.value.trim();
            if (!text) return;

            const res = await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            const newTask = await res.json();
            renderTask(newTask);
            itemInput.value = '';
        }

        function renderTask(task) {
            const li = document.createElement('li');
            if (task.completed) li.classList.add('completed');

            const itemLeft = document.createElement('div');
            itemLeft.className = 'item-left';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = task.completed;
            checkbox.onclick = async () => {
                await fetch(`/api/tasks/${task.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ completed: checkbox.checked })
                });
                li.classList.toggle('completed', checkbox.checked);
            };

            const textSpan = document.createElement('span');
            textSpan.className = 'item-text';
            textSpan.textContent = task.text;

            itemLeft.appendChild(checkbox);
            itemLeft.appendChild(textSpan);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = 'Delete';
            deleteBtn.onclick = async () => {
                await fetch(`/api/tasks/${task.id}`, { method: 'DELETE' });
                li.remove();
            };

            li.appendChild(itemLeft);
            li.appendChild(deleteBtn);
            checklist.appendChild(li);
        }
    </script>
</body>
</html>
