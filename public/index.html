<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Checklist</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; display: flex; justify-content: center; padding-top: 30px; margin: 0; }
        .container { background-color: #1a1a1e; padding: 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); width: 100%; max-width: 500px; }
        h1 { margin-top: 0; font-size: 20px; color: #fff; text-align: center; margin-bottom: 15px; }
        
        /* Compact Input Styling */
        .input-area { display: flex; gap: 6px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 6px 10px; border: 1px solid #2e2e35; border-radius: 4px; background-color: #202024; color: #fff; font-size: 13px; }
        input[type="text"]:focus { outline: 1px solid #04d361; }
        
        /* Smaller buttons */
        button { padding: 6px 12px; background-color: #04d361; color: #000; border: none; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; }
        button:hover { background-color: #02b351; }
        
        ul { list-style: none; padding: 0; margin: 0; }
        
        /* Compact Parent Task styling */
        .task-node { margin-bottom: 12px; background-color: #1d1d22; border: 1px solid #2e2e35; border-radius: 6px; padding: 6px; }
        .task-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; }
        
        /* Sublist nesting and its tiny input row */
        .sublist-wrapper { margin-left: 20px; margin-top: 4px; border-left: 1px solid #3e3e4a; padding-left: 8px; }
        .sublist { margin-bottom: 6px; }
        .subtask-row { display: flex; align-items: center; justify-content: space-between; padding: 3px 6px; background-color: #121214; border: 1px dashed #2e2e35; border-radius: 4px; margin-bottom: 4px; }

        /* Dedicated small input box under each item */
        .inline-sub-input { display: flex; gap: 4px; margin-top: 4px; }
        .inline-sub-input input[type="text"] { padding: 4px 8px; font-size: 11px; background-color: #121214; }
        .inline-sub-input button { padding: 4px 8px; font-size: 11px; }

        .item-left { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        
        /* Shrunk Checkboxes */
        input[type="checkbox"] { width: 13px; height: 13px; cursor: pointer; accent-color: #04d361; margin: 0; }
        
        .completed .item-text { text-decoration: line-through; color: #7c7c8a; }
        
        /* Ultra-compact action items */
        .delete-btn { background: none; color: #f75a68; border: none; font-size: 11px; cursor: pointer; padding: 2px 4px; }
        .delete-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧠 Birbals learning Checklist</h1>
        <div class="input-area">
            <input type="text" id="itemInput" placeholder="Add a main task..." autocomplete="off">
            <button onclick="addItem()">Add</button>
        </div>
        <ul id="checklist"></ul>
    </div>

    <script>
        const itemInput = document.getElementById('itemInput');
        const checklist = document.getElementById('checklist');

        document.addEventListener('DOMContentLoaded', loadTasks);
        itemInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addItem(); });

        async function loadTasks() {
            checklist.innerHTML = '';
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            
            const parents = tasks.filter(t => !t.parent_id);
            const subs = tasks.filter(t => t.parent_id);

            parents.forEach(parent => {
                renderParent(parent);
                const children = subs.filter(s => s.parent_id === parent.id);
                children.forEach(child => renderSubtask(child));
            });
        }

        async function addItem() {
            const text = itemInput.value.trim();
            if (!text) return;

            const res = await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            const newTask = await res.json();
            newTask.parent_id = null;
            renderParent(newTask);
            itemInput.value = '';
        }

        function renderParent(task) {
            const taskNode = document.createElement('div');
            taskNode.className = 'task-node';
            taskNode.id = `node-${task.id}`;

            taskNode.innerHTML = `
                <div class="task-row ${task.completed ? 'completed' : ''}" id="task-${task.id}">
                    <div class="item-left">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleCheck(${task.id}, this)">
                        <span class="item-text"><b>${task.text}</b></span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id}, true)">Delete</button>
                </div>
                
                <div class="sublist-wrapper">
                    <div class="sublist" id="sublist-${task.id}"></div>
                    
                    <div class="inline-sub-input">
                        <input type="text" id="subInput-${task.id}" placeholder="Add subtask..." autocomplete="off">
                        <button onclick="addSubtask(${task.id})">+</button>
                    </div>
                </div>
            `;
            checklist.appendChild(taskNode);

            // Add hit enter support for the nested input box
            const subInput = document.getElementById(`subInput-${task.id}`);
            subInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addSubtask(task.id);
            });
        }

        function renderSubtask(task) {
            const sublistContainer = document.getElementById(`sublist-${task.parent_id}`);
            if (!sublistContainer) return;

            const subtaskDiv = document.createElement('div');
            subtaskDiv.className = `subtask-row ${task.completed ? 'completed' : ''}`;
            subtaskDiv.id = `task-${task.id}`;
            subtaskDiv.innerHTML = `
                <div class="item-left">
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleCheck(${task.id}, this)">
                    <span class="item-text">${task.text}</span>
                </div>
                <button class="delete-btn" onclick="deleteTask(${task.id}, false)">Delete</button>
            `;
            sublistContainer.appendChild(subtaskDiv);
        }

        async function addSubtask(parentId) {
            const subInput = document.getElementById(`subInput-${parentId}`);
            const text = subInput.value.trim();
            if (!text) return;

            const res = await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, parent_id: parentId })
            });
            const newSub = await res.json();
            renderSubtask(newSub);
            
            subInput.value = '';
            subInput.focus();
        }

        async function toggleCheck(id, checkbox) {
            await fetch(`/api/tasks/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completed: checkbox.checked })
            });
            document.getElementById(`task-${id}`).classList.toggle('completed', checkbox.checked);
        }

        async function deleteTask(id, isParent) {
            await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
            if (isParent) {
                document.getElementById(`node-${id}`).remove();
            } else {
                document.getElementById(`task-${id}`).remove();
            }
        }
    </script>
</body>
</html>
